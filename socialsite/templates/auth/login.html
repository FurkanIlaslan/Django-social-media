{% extends 'base.html' %}

{% block title %}Giriş - SocialSite{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
  <h2 class="text-2xl font-bold mb-4 text-gray-800">Hesabınıza giriş yapın</h2>
  
  {% if error %}
  <div class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
    <div class="flex items-center gap-2">
      <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span>{{ error }}</span>
    </div>
  </div>
  {% endif %}
  
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="block text-sm text-gray-600">E-posta veya kullanıcı adı</label>
      <input name="username" placeholder="ör. furkan veya furkan@example.com" value="{{ username|default:'' }}" class="w-full border border-gray-200 rounded-xl p-3 mt-2 focus:outline-none focus:ring-2 focus:ring-primary/30" />
    </div>
    <div class="mb-4">
      <label class="block text-sm text-gray-600">Parola</label>
      <input name="password" type="password" placeholder="Parolanızı girin" class="w-full border border-gray-200 rounded-xl p-3 mt-2 focus:outline-none focus:ring-2 focus:ring-primary/30" />
    </div>
    <div class="text-right mb-4">
      <a href="/password-reset/" class="text-sm text-primary hover:underline">Şifremi unuttum</a>
    </div>
    <button class="w-full bg-gradient-to-r from-primary to-accent text-white py-3 rounded-2xl shadow">Giriş</button>
  </form>
  <p class="text-sm text-gray-500 mt-4">Hesabın yok mu? <a href="/signup" class="text-primary font-medium">Kayıt ol</a></p>
</div>
{% endblock %}
