{% extends 'base.html' %}

{% block title %}Şifremi Unuttum{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
  <h2 class="text-2xl font-bold mb-2 text-gray-800">Şifrenizi sıfırlayın</h2>
  <p class="text-sm text-gray-500 mb-6">E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.</p>
  
  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="block text-sm text-gray-600">E-posta</label>
      <input name="email" type="email" placeholder="ornek@email.com" class="w-full border border-gray-200 rounded-xl p-3 mt-2 focus:outline-none focus:ring-2 focus:ring-primary/30" required />
    </div>
    <button class="w-full bg-gradient-to-r from-primary to-accent text-white py-3 rounded-2xl shadow">Sıfırlama bağlantısı gönder</button>
  </form>
  
  <p class="text-sm text-gray-500 mt-4">
    <a href="{% url 'login' %}" class="text-primary hover:underline">← Giriş sayfasına dön</a>
  </p>
</div>
{% endblock %}
